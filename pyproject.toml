[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-signal-modulation-classification"
version = "0.1.0"
description = "PyTorch-based automatic modulation classification and SNR robustness evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
    "torch==2.12.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
